# genome.toml — holon's role→path map and genome modules. Replaces kb.toml.
# The pointer_ignore list lives under [core] here because genome rejects it under
# [paths] (E017).
#
# Pointer forms: `overlay:<path>` — the role lives in the operator's private
# overlay repo (AGENTS.md, "The universal repo and the personal overlay");
# `native:<note>` — a holon-native mechanism owns it and this tooling defers
# to it, never shadows it. Both are reported by `scripts/genome doctor` as
# legitimately-elsewhere, never as missing.
[genome]
schema_version = 2
modules = ["core", "records", "agents"]   # the legacy kb.toml set, unchanged

[core]
pointer_ignore = "BRIEF.md holon.toml INDEX.md"   # AGENTS.md path refs that live in $HOLON_HOME or are referenced by bare name inside their own row, not in this repo
# the gate this repo's own AGENTS.md names, as one command
gate = "./scripts/gate.sh"
# the judgement the repo's laws make mandatory
checklist = [
  "nothing personal landed here: no host, path, chat id, endpoint or deployment note",
  "a design record published here is scrubbed of the operator's context",
  "the strict lint passes with zero errors and zero warnings",
]
# generated by the tooling, never committed by close
never_commit = ["**/__pycache__/**", "build/**", "**/*.genome-lock", ".genome/**"]

[paths]
agents = "AGENTS.md"
entry = "AGENTS.md"            # the reading order at the end of AGENTS.md
register = "TODO.md"
plans = "docs/design"          # dated records serve both roles; the date is the freeze stamp
audits = "docs/design"
decisions = "docs/decisions"   # AD-NNN, minted on the Chair's ratification
archive = "docs/archive"       # tombstones at the original path, INDEX.md here
ledger = "native:the regression-ledger table in AGENTS.md, guard-checked by holon lint (ref.guard)"
regressions = "native:the regression ledger's rows (a bite plus the law that prevents it)"
workflows = "native:the organization's own board — `holon task list` / api_board / [budget] caps"
state = "docs/STATUS.md"
worklog = "docs/design"
feed = "overlay:the operator's overlay messages"
runbook = "PERSONAL.md"

# References in AGENTS.md prose that are legitimate non-repo paths (per-line,
# path-shaped backticked tokens are existence-checked by `genome lint`):
# the per-run brief and the instance config live in $HOLON_HOME, never here
# (law: instance state stays out of the distribution). The operator's private
# facts (the Chair's channel, host paths, instance ids) live at
# $HOLON_HOME/config/operator-context.md and are cited by role, never inlined;
# the two-repo overlay split was deprecated 2026-10-27.

[card]
architecture = "AGENTS.md"
# The `runbook` role above is `native:` (a holon-native mechanism owns it), so the card's
# `operate` class would otherwise be empty. This file pointer names the section that
# actually holds the commands; the `native:` role stays the owner.
operate = "AGENTS.md#Verify a change"
